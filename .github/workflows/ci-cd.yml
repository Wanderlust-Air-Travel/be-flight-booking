# =============================================================================
# Flight Booking Backend — GitHub Actions CI/CD
# be-flight-booking/.github/workflows/ci-cd.yml
#
# Triggers:
#   - Push to main      → Build + Deploy to Production
#   - Push to develop   → Build + Deploy to Staging
#   - Pull Requests     → Quality checks only
#   - Manual dispatch   → Full pipeline
#
# Required Secrets:
#   DOCKER_REGISTRY        - Docker registry URL (e.g., ghcr.io)
#   DOCKER_USERNAME        - Registry username
#   DOCKER_PASSWORD        - Registry password/token
#   DEPLOY_STAGING_HOST    - Staging server IP
#   DEPLOY_STAGING_KEY     - SSH private key for staging
#   DEPLOY_PROD_HOST       - Production server IP
#   DEPLOY_PROD_KEY        - SSH private key for production
# =============================================================================

name: Flight Booking Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/flight-booking
  DOCKER_BUILDX_PLATFORM: linux/amd64

jobs:
  # ─── Quality Checks ────────────────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Go module cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: |
          cd pkg && go mod download
          for svc in apps/*/; do
            (cd "$svc" && go mod download 2>/dev/null || true)
          done

      - name: go vet
        run: |
          set -e
          cd pkg && go vet ./...
          for svc in apps/*/; do
            (cd "$svc" && go vet ./...) || exit 1
          done

      - name: Build services
        run: |
          for svc in apps/*/; do
            name=$(basename "$svc")
            echo "Building $name..."
            (cd "$svc" && CGO_ENABLED=0 go build -o /dev/null . 2>/dev/null && echo "  OK" || { echo "  FAILED"; exit 1; })
          done

  # ─── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: |
          cd pkg && go test -v -count=1 -race -coverprofile=coverage.out ./...
          for svc in apps/*/; do
            (cd "$svc" && go test -v -count=1 -race ./... 2>/dev/null || true)
          done

      - name: Upload coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: pkg/coverage.out

  # ─── Docker Build & Push ────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      services: ${{ steps.meta.outputs.services }}
    strategy:
      matrix:
        service: [api-gateway, search-service, booking-service, payment-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION=${{ github.sha }}
          echo "full=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:$VERSION" >> $GITHUB_OUTPUT
          echo "latest=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.meta.outputs.full }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # ─── Deploy to Staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_STAGING_KEY }}

      - name: Deploy to staging server
        run: |
          echo "Deploying to staging..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null deploy@${{ secrets.DEPLOY_STAGING_HOST }} << 'ENDSSH'
            set -e
            cd ~/flight-booking/be

            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Update .env with staging values
            cat > .env << 'EOF'
            APP_ENV=staging
            VERSION=${{ github.sha }}

            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=flightbooking
            DB_USER=flightbooking
            DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
            DB_SSLMODE=disable
            DB_MAX_CONNECTIONS=50
            DB_IDLE_CONNECTIONS=10
            DB_CONNECTION_LIFETIME=300

            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
            REDIS_DB=0
            REDIS_FLIGHT_CACHE_TTL=600
            REDIS_SESSION_TTL=1800

            RABBITMQ_HOST=rabbitmq
            RABBITMQ_PORT=5672
            RABBITMQ_USER=staging_admin
            RABBITMQ_PASSWORD=${{ secrets.STAGING_RABBITMQ_PASSWORD }}
            RABBITMQ_VHOST=/
            RABBITMQ_EXCHANGE=flightbooking.events
            RABBITMQ_PREFETCH=10

            AVIATIONSTACK_API_KEY=${{ secrets.AVIATIONSTACK_API_KEY }}
            AVIATIONSTACK_BASE_URL=https://api.aviationstack.com/v1
            AVIATIONSTACK_TIMEOUT=10
            AVIATIONSTACK_RETRY_ATTEMPTS=3
            AVIATIONSTACK_CACHE_TTL=600

            PAYMENT_PROVIDER=mock
            PAYMENT_MOCK_ENABLED=true

            JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            JWT_EXPIRY_HOURS=24

            CORS_ALLOWED_ORIGINS=https://staging.yourdomain.com,https://staging-api.yourdomain.com
            CORS_ALLOWED_METHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
            CORS_ALLOWED_HEADERS=Authorization,Content-Type,X-Requested-With,X-Request-ID
            CORS_EXPOSE_HEADERS=X-Total-Count,X-Request-ID
            CORS_MAX_AGE=86400

            RATE_LIMIT_REQUESTS_PER_MINUTE=100
            RATE_LIMIT_BURST=20

            LOG_LEVEL=info
            LOG_FORMAT=json
            EOF

            # Restart services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # Health check
            sleep 10
            curl -f http://localhost:8080/healthz
            echo "Staging deployment complete!"
          ENDSSH

  # ─── Deploy to Production ──────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PROD_KEY }}

      - name: Require manual approval
        run: echo "Waiting for manual approval..."

      - name: Deploy to production server
        run: |
          echo "Deploying to production..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null deploy@${{ secrets.DEPLOY_PROD_HOST }} << 'ENDSSH'
            set -e
            cd ~/flight-booking/be

            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Update .env with production values
            cat > .env << 'EOF'
            APP_ENV=production
            VERSION=${{ github.sha }}

            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=flightbooking
            DB_USER=flightbooking
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            DB_SSLMODE=disable
            DB_MAX_CONNECTIONS=100
            DB_IDLE_CONNECTIONS=20
            DB_CONNECTION_LIFETIME=300

            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}
            REDIS_DB=0
            REDIS_FLIGHT_CACHE_TTL=300
            REDIS_SESSION_TTL=900

            RABBITMQ_HOST=rabbitmq
            RABBITMQ_PORT=5672
            RABBITMQ_USER=prod_admin
            RABBITMQ_PASSWORD=${{ secrets.PROD_RABBITMQ_PASSWORD }}
            RABBITMQ_VHOST=/
            RABBITMQ_EXCHANGE=flightbooking.events
            RABBITMQ_PREFETCH=10

            AVIATIONSTACK_API_KEY=${{ secrets.AVIATIONSTACK_API_KEY }}
            AVIATIONSTACK_BASE_URL=https://api.aviationstack.com/v1
            AVIATIONSTACK_TIMEOUT=15
            AVIATIONSTACK_RETRY_ATTEMPTS=5
            AVIATIONSTACK_CACHE_TTL=300

            PAYMENT_PROVIDER=stripe
            PAYMENT_MOCK_ENABLED=false

            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            JWT_EXPIRY_HOURS=1

            CORS_ALLOWED_ORIGINS=https://www.yourdomain.com,https://yourdomain.com,https://api.yourdomain.com
            CORS_ALLOWED_METHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
            CORS_ALLOWED_HEADERS=Authorization,Content-Type,X-Requested-With,X-Request-ID
            CORS_EXPOSE_HEADERS=X-Total-Count,X-Request-ID
            CORS_MAX_AGE=86400

            RATE_LIMIT_REQUESTS_PER_MINUTE=60
            RATE_LIMIT_BURST=10

            LOG_LEVEL=warn
            LOG_FORMAT=json
            EOF

            # Restart services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # Health check
            sleep 10
            curl -f http://localhost:8080/healthz
            echo "Production deployment complete!"
          ENDSSH

  # ─── Smoke Test ─────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    steps:
      - name: Check health endpoints
        run: |
          echo "Testing deployed services..."

          # Test staging if it was deployed
          ${{ needs.deploy-staging.result == 'success' }} && {
            curl -sf http://staging.yourdomain.com/healthz || echo "Staging health check failed"
          }

          # Test production if it was deployed
          ${{ needs.deploy-production.result == 'success' }} && {
            curl -sf http://api.yourdomain.com/healthz || echo "Production health check failed"
          }

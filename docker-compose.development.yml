# =============================================================================
# Wanderlust Air Travel — Development Docker Compose (APPLICATION SERVICES ONLY)
# be-flight-booking/docker-compose.development.yml
#
# This file contains ONLY application services. Infrastructure (SQL Server,
# Redis, RabbitMQ) is defined separately in docker-compose.infrastructure.development.yml.
#
# IMPORTANT:
#   - Infrastructure must already be running (start it first with the
#     infrastructure compose file, or run both files together as shown below).
#   - There is NO `profiles` flag — all services here start by default.
#   - ALL configuration is loaded from .env.development via --env-file.
#     No defaults are baked in — every variable must come from the env file.
#
# Usage:
#   # Infrastructure only:
#   docker compose -f docker-compose.infrastructure.development.yml \
#     --env-file .env.development up -d
#
#   # Application services only (infrastructure must be running):
#   docker compose -f docker-compose.development.yml \
#     --env-file .env.development up -d
#
#   # Full stack (infra + app):
#   docker compose -f docker-compose.infrastructure.development.yml \
#     -f docker-compose.development.yml \
#     --env-file .env.development up -d
# =============================================================================

networks:
  default:
    name: be-flight-booking_default
    external: true

services:
  # ─── API Gateway (HTTP) ────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.development
    container_name: wat-api-gateway
    image: wanderlust-air/nestjs-api-gateway:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_CERT: ${DB_TRUST_CERT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      APP_URL: ${APP_URL}
      # Peer hosts: resolved by Docker DNS from .env.development
      SEARCH_MS_HOST: ${SEARCH_MS_PEER_HOST}
      SEARCH_MS_PEER_HOST: ${SEARCH_MS_PEER_HOST}
      SEARCH_MS_PORT: ${SEARCH_MS_PORT}
      SERVICES_MS_HOST: ${SERVICES_MS_PEER_HOST}
      SERVICES_MS_PEER_HOST: ${SERVICES_MS_PEER_HOST}
      SERVICES_MS_PORT: ${SERVICES_MS_PORT}
      ROUTES_MS_HOST: ${ROUTES_MS_PEER_HOST}
      ROUTES_MS_PEER_HOST: ${ROUTES_MS_PEER_HOST}
      ROUTES_MS_PORT: ${ROUTES_MS_PORT}
      BOOKING_MS_HOST: ${BOOKING_MS_PEER_HOST}
      BOOKING_MS_PEER_HOST: ${BOOKING_MS_PEER_HOST}
      BOOKING_MS_PORT: ${BOOKING_MS_PORT}
      RESERVATION_MS_HOST: ${RESERVATION_MS_PEER_HOST}
      RESERVATION_MS_PEER_HOST: ${RESERVATION_MS_PEER_HOST}
      RESERVATION_MS_PORT: ${RESERVATION_MS_PORT}
      PAYMENT_MS_HOST: ${PAYMENT_MS_PEER_HOST}
      PAYMENT_MS_PEER_HOST: ${PAYMENT_MS_PEER_HOST}
      PAYMENT_MS_PORT: ${PAYMENT_MS_PORT}
      EMAIL_MS_HOST: ${EMAIL_MS_PEER_HOST}
      EMAIL_MS_PEER_HOST: ${EMAIL_MS_PEER_HOST}
      EMAIL_MS_PORT: ${EMAIL_MS_PORT}
    ports:
      - "${API_GATEWAY_PORT}:3000"
    volumes:
      - api_gateway_public:/app/public
      - api_gateway_dist:/app/dist
      - /app/node_modules
    depends_on:
      sqlserver: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      search-ms: { condition: service_started }
      services-ms: { condition: service_started }
      routes-ms: { condition: service_started }
      booking-ms: { condition: service_started }
      reservation-ms: { condition: service_started }
      payment-ms: { condition: service_started }
      email-ms: { condition: service_started }

  # ─── Search Microservice (TCP) ─────────────────────────────────────────────
  search-ms:
    build: { context: ., dockerfile: Dockerfile.development }
    container_name: wat-search-ms
    image: wanderlust-air/nestjs-search-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_CERT: ${DB_TRUST_CERT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      SEARCH_MS_HOST: ${SEARCH_MS_HOST}
      SEARCH_MS_PORT: ${SEARCH_MS_PORT}
    command: ["node", "dist/microservices/search/main.search.js"]
    volumes:
      - search_ms_dist:/app/dist
      - /app/node_modules
    depends_on:
      sqlserver: { condition: service_healthy }
    healthcheck: { disable: true }

  # ─── Services Microservice (TCP) ──────────────────────────────────────────
  services-ms:
    build: { context: ., dockerfile: Dockerfile.development }
    container_name: wat-services-ms
    image: wanderlust-air/nestjs-services-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_CERT: ${DB_TRUST_CERT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      SERVICES_MS_HOST: ${SERVICES_MS_HOST}
      SERVICES_MS_PORT: ${SERVICES_MS_PORT}
    command: ["node", "dist/microservices/services/main.services.js"]
    volumes:
      - services_ms_dist:/app/dist
      - /app/node_modules
    depends_on:
      sqlserver: { condition: service_healthy }
    healthcheck: { disable: true }

  # ─── Routes Microservice (TCP) ────────────────────────────────────────────
  routes-ms:
    build: { context: ., dockerfile: Dockerfile.development }
    container_name: wat-routes-ms
    image: wanderlust-air/nestjs-routes-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_CERT: ${DB_TRUST_CERT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      ROUTES_MS_HOST: ${ROUTES_MS_HOST}
      ROUTES_MS_PORT: ${ROUTES_MS_PORT}
    command: ["node", "dist/microservices/routes/main.routes.js"]
    volumes:
      - routes_ms_dist:/app/dist
      - /app/node_modules
    depends_on:
      sqlserver: { condition: service_healthy }
    healthcheck: { disable: true }

  # ─── Booking Microservice (TCP) ────────────────────────────────────────────
  booking-ms:
    build: { context: ., dockerfile: Dockerfile.development }
    container_name: wat-booking-ms
    image: wanderlust-air/nestjs-booking-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_CERT: ${DB_TRUST_CERT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      BOOKING_MS_HOST: ${BOOKING_MS_HOST}
      BOOKING_MS_PORT: ${BOOKING_MS_PORT}
      # Peer hosts: resolved by Docker DNS from .env.development
      RESERVATION_MS_HOST: ${RESERVATION_MS_PEER_HOST}
      RESERVATION_MS_PORT: ${RESERVATION_MS_PORT}
      EMAIL_MS_HOST: ${EMAIL_MS_PEER_HOST}
      EMAIL_MS_PORT: ${EMAIL_MS_PORT}
    command: ["node", "dist/microservices/booking/main.booking.js"]
    volumes:
      - booking_ms_dist:/app/dist
      - /app/node_modules
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: { disable: true }

  # ─── Reservation Microservice (TCP) ────────────────────────────────────────
  reservation-ms:
    build: { context: ., dockerfile: Dockerfile.development }
    container_name: wat-reservation-ms
    image: wanderlust-air/nestjs-reservation-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_CERT: ${DB_TRUST_CERT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      RESERVATION_MS_HOST: ${RESERVATION_MS_HOST}
      RESERVATION_MS_PORT: ${RESERVATION_MS_PORT}
    command: ["node", "dist/microservices/reservation/main.reservation.js"]
    volumes:
      - reservation_ms_dist:/app/dist
      - /app/node_modules

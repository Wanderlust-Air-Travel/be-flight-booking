      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      EMAIL_MS_HOST: ${EMAIL_MS_HOST}
      EMAIL_MS_PORT: ${EMAIL_MS_PORT}
    command: ["node", "dist/microservices/email/main.email.js"]
    volumes:
      - email_ms_dist:/app/dist
      - /app/node_modules
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: { disable: true }

volumes:
  api_gateway_public:
  api_gateway_dist:
  search_ms_dist:
  services_ms_dist:
  routes_ms_dist:
  booking_ms_dist:
  reservation_ms_dist:
  payment_ms_dist:
  email_ms_dist:

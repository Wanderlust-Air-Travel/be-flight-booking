# =============================================================================
# Flight Booking — Infrastructure Docker Compose (SQL Server + Redis + RabbitMQ)
# be-flight-booking/docker-compose.infrastructure.yml
#
# Usage:
#   Development: docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml up -d
#   Staging:     docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml up -d --env-file .env.staging
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --env-file .env.production
# =============================================================================

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
      # - MSSQL_TCP_PORT=1434
      # - MSSQL_IP_ADDRESS=0.0.0.0
    ports:
      - "${DB_PORT}:1433"  # Map from .env DB_PORT to SQL Server default port 1433
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:6379"  # Map from .env REDIS_PORT to Redis default port 6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_PORT}:5672"   # AMQP port (from .env)
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  # SQL Server data persistence
  sqlserver-data:
  # Redis data persistence
  redis-data:
  # RabbitMQ data persistence
  rabbitmq-data:

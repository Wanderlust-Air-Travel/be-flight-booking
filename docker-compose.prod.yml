# =============================================================================
# Wanderlust Air Travel — Production Docker Compose Overrides
# be-flight-booking/docker-compose.prod.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================

services:
  api-gateway:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  sqlserver:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  redis:
    restart: always
    command: redis-server --maxmemory 1g --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --appendonly yes --appendfsync everysec

  rabbitmq:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  # ─── Microservices ───────────────────────────────────────────────────
  search-ms:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  services-ms:
    restart: always

  routes-ms:
    restart: always

  booking-ms:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  reservation-ms:
    restart: always

  payment-ms:
    restart: always

  email-ms:
    restart: always

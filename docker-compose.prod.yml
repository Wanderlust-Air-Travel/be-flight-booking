# =============================================================================
# Flight Booking Backend — Production Docker Compose Overrides
# be-flight-booking/docker-compose.prod.yml
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Features:
#   - Resource limits on all services
#   - Replicated services for high availability
#   - Production-tuned database settings
#   - Log rotation and persistence
#   - Removed development ports (use reverse proxy instead)
# =============================================================================

services:
  # ─── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
    # No external port — use reverse proxy (nginx/traefik) or Cloudflare Tunnel

  # ─── Search Service ──────────────────────────────────────────────────────────
  search-service:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  # ─── Booking Service ─────────────────────────────────────────────────────────
  booking-service:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  # ─── Payment Service ─────────────────────────────────────────────────────────
  payment-service:
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c wal_level=replica
      -c max_wal_size=1GB
      -c min_wal_size=80MB
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
    # No external port — use Docker network only

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    command: >
      redis-server
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
      --loglevel notice
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  # ─── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '5'
    # RabbitMQ Management UI: keep port 15672 for internal access
    # External access via Cloudflare Tunnel only

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  default:
    name: flight-booking-net
    driver: bridge

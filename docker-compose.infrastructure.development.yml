# =============================================================================
# Wanderlust Air Travel — DEVELOPMENT Infrastructure Docker Compose (Standalone)
# be-flight-booking/docker-compose.infrastructure.development.yml
#
# This file is a STANDALONE infrastructure stack for DEVELOPMENT. It contains
# ONLY infrastructure services:
#   - SQL Server (host port 1434 -> container port 1433, see DB_PORT in .env.development)
#   - Redis (port 6379)
#   - RabbitMQ (ports 5672, 15672)
#
# Application services (api-gateway, search-ms, services-ms, routes-ms,
# booking-ms, reservation-ms, payment-ms, email-ms) are defined separately in
# docker-compose.development.yml.
#
# Usage:
#   # Infrastructure only:
#   docker compose -f docker-compose.infrastructure.development.yml \
#     --env-file .env.development up -d
#
#   # Full stack (infra + app):
#   docker compose -f docker-compose.infrastructure.development.yml \
#     -f docker-compose.development.yml \
#     --env-file .env.development up -d
#
# NOTE: The host-side port is pinned to 1434 (not 1433) because port 1433 is
# frequently occupied on Windows hosts by a local SQL Server / Azure Data
# Studio / Docker Desktop relay. Override with DB_PORT in .env.development if
# you really want to use 1433 and you know it's free.
# =============================================================================

services:
  # ─── SQL Server (Database) ────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wat-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${DB_PASS:-StrongPass1234}
      SA_PASSWORD: ${DB_PASS:-StrongPass1234}
      MSSQL_PID: Developer
    ports:
      # Pinned to host port 1434 (container 1433) because Windows hosts often
      # have something else on 1433 (local SQL Server, Azure Data Studio,
      # Docker Desktop relay, etc.). See DB_PORT in .env.development.
      - "${DB_PORT:-1434}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASS:-StrongPass1234} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── Redis (Cache) ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wat-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── RabbitMQ (Message Broker) ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmqpass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
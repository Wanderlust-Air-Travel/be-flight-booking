# =============================================================================
# Wanderlust Air Travel — Docker Compose Base (Application only)
# be-flight-booking/
#
# Architecture: 8 services total
#   - 1 API Gateway (HTTP, port 3000)
#   - 7 Microservices (TCP): Search, Services, Routes, Booking, Reservation, Payment, Email
#
# Usage:
#   Development (native): npm run start:all
#   Development (docker): docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml --env-file .env.development up -d
#   Staging:     docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.staging.yml --env-file .env.staging up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================


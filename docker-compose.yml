services:
  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env  # Load environment variables from .env file (app.config.ts will use defaults if not set)
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - SEARCH_MS_HOST=${SEARCH_MS_HOST}
      - SERVICES_MS_HOST=${SERVICES_MS_HOST}
      - ROUTES_MS_HOST=${ROUTES_MS_HOST}
      - BOOKING_MS_HOST=${BOOKING_MS_HOST}
      - RESERVATION_MS_HOST=${RESERVATION_MS_HOST}
      - PAYMENT_MS_HOST=${PAYMENT_MS_HOST}
      - EMAIL_MS_HOST=${EMAIL_MS_HOST}
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "3000:3000"  # API Gateway
      - "4001:4001"  # Search MS
      - "4002:4002"  # Services MS
      - "4003:4003"  # Routes MS
      - "4004:4004"  # Booking MS
      - "4005:4005"  # Reservation MS
      - "4006:4006"  # Payment MS
      - "4007:4007"  # Email MS
    volumes:
      # Persist uploaded images to host filesystem
      - ./public:/app/public
      # Gmail API credentials and token
      - ./credentials_desktop_apps.json:/app/credentials_desktop_apps.json:ro
      - ./token.json:/app/token.json:rw
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "npm run wait-for-sqlserver && npm run wait-for-rabbitmq && npm run init-db && npm run wait-for-db && npm run seed:if-empty && npm run gmail:auth && npm run start:all"
    restart: unless-stopped


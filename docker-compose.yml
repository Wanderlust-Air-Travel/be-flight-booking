services:
  # ─── API Gateway (HTTP) ────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-api-gateway
    image: wanderlust-air/nestjs-api-gateway:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-api-gateway
      SEARCH_MS_HOST: search-ms
      SEARCH_MS_PORT: ${SEARCH_MS_PORT:-4001}
      SERVICES_MS_HOST: services-ms
      SERVICES_MS_PORT: ${SERVICES_MS_PORT:-4002}
      ROUTES_MS_HOST: routes-ms
      ROUTES_MS_PORT: ${ROUTES_MS_PORT:-4003}
      BOOKING_MS_HOST: booking-ms
      BOOKING_MS_PORT: ${BOOKING_MS_PORT:-4004}
      RESERVATION_MS_HOST: reservation-ms
      RESERVATION_MS_PORT: ${RESERVATION_MS_PORT:-4005}
      PAYMENT_MS_HOST: payment-ms
      PAYMENT_MS_PORT: ${PAYMENT_MS_PORT:-4006}
      EMAIL_MS_HOST: email-ms
      EMAIL_MS_PORT: ${EMAIL_MS_PORT:-4007}
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./public:/app/public
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      search-ms:
        condition: service_started
      services-ms:
        condition: service_started
      routes-ms:
        condition: service_started
      booking-ms:
        condition: service_started
      reservation-ms:
        condition: service_started
      payment-ms:
        condition: service_started
      email-ms:
        condition: service_started

  # ─── Search Microservice (TCP:4001) ──────────────────────────────────────────
  search-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-search-ms
    image: wanderlust-air/nestjs-search-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-search-ms
      SEARCH_MS_HOST: "0.0.0.0"
      SEARCH_MS_PORT: 4001
    command: ["node", "dist/microservices/search/main.search.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      disable: true

  # ─── Services Microservice (TCP:4002) ──────────────────────────────────────
  services-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-services-ms
    image: wanderlust-air/nestjs-services-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-services-ms
      SERVICES_MS_HOST: "0.0.0.0"
      SERVICES_MS_PORT: 4002
    command: ["node", "dist/microservices/services/main.services.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      disable: true

  # ─── Routes Microservice (TCP:4003) ────────────────────────────────────────
  routes-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-routes-ms
    image: wanderlust-air/nestjs-routes-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-routes-ms
      ROUTES_MS_HOST: "0.0.0.0"
      ROUTES_MS_PORT: 4003
    command: ["node", "dist/microservices/routes/main.routes.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      disable: true

  # ─── Booking Microservice (TCP:4004) ──────────────────────────────────────
  booking-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-booking-ms
    image: wanderlust-air/nestjs-booking-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-booking-ms
      BOOKING_MS_HOST: "0.0.0.0"
      BOOKING_MS_PORT: 4004
      RESERVATION_MS_HOST: reservation-ms
      RESERVATION_MS_PORT: ${RESERVATION_MS_PORT:-4005}
    command: ["node", "dist/microservices/booking/main.booking.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true

  # ─── Reservation Microservice (TCP:4005) ───────────────────────────────────
  reservation-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-reservation-ms
    image: wanderlust-air/nestjs-reservation-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-reservation-ms
      RESERVATION_MS_HOST: "0.0.0.0"
      RESERVATION_MS_PORT: 4005
    command: ["node", "dist/microservices/reservation/main.reservation.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      disable: true

  # ─── Payment Microservice (TCP:4006) ────────────────────────────────────────
  payment-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-payment-ms
    image: wanderlust-air/nestjs-payment-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-payment-ms
      PAYMENT_MS_HOST: "0.0.0.0"
      PAYMENT_MS_PORT: 4006
      APP_URL: ${APP_URL:-http://localhost:3001}
    command: ["node", "dist/microservices/payment/main.payment.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true

  # ─── Email Microservice (TCP:4007) ─────────────────────────────────────────
  email-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-email-ms
    image: wanderlust-air/nestjs-email-ms:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *env-email-ms
      EMAIL_MS_HOST: "0.0.0.0"
      EMAIL_MS_PORT: 4007
    command: ["node", "dist/microservices/email/main.email.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true

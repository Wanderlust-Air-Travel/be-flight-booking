# =============================================================================
# Flight Booking — Production-ready Docker Compose
# be-flight-booking/
# Usage:
#   Development: docker compose up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ─── Go Microservices ───────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: fb-api-gateway
    image: flight-booking/api-gateway:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
      - "${GRPC_PORT:-50051}:50051"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: flight-booking
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flightbooking}
      DB_USER: ${DB_USER:-flightbooking}
      DB_PASSWORD: ${DB_PASSWORD:-flightbooking123}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1

  search-service:
    build:
      context: ./apps/search-service
      dockerfile: Dockerfile
    container_name: fb-search-service
    image: flight-booking/search-service:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${SEARCH_SERVICE_PORT:-8090}:8090"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flightbooking}
      DB_USER: ${DB_USER:-flightbooking}
      DB_PASSWORD: ${DB_PASSWORD:-flightbooking123}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1

  booking-service:
    build:
      context: ./apps/booking-service
      dockerfile: Dockerfile
    container_name: fb-booking-service
    image: flight-booking/booking-service:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${BOOKING_SERVICE_PORT:-8091}:8091"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flightbooking}
      DB_USER: ${DB_USER:-flightbooking}
      DB_PASSWORD: ${DB_PASSWORD:-flightbooking123}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1

  payment-service:
    build:
      context: ./apps/payment-service
      dockerfile: Dockerfile
    container_name: fb-payment-service
    image: flight-booking/payment-service:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PAYMENT_SERVICE_PORT:-8092}:8092"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flightbooking}
      DB_USER: ${DB_USER:-flightbooking}
      DB_PASSWORD: ${DB_PASSWORD:-flightbooking123}
      DB_SSLMODE: disable
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: fb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flightbooking}
      POSTGRES_USER: ${DB_USER:-flightbooking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flightbooking123}
      POSTGRES_MAX_CONNECTIONS: 100
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-migrate:/migrations:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flightbooking} -d ${DB_NAME:-flightbooking}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fb-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fb-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  default:
    name: flight-booking-net
    driver: bridge

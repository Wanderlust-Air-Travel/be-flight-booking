# =============================================================================
# Wanderlust Air Travel — Docker Compose Base (Application only)
# be-flight-booking/
#
# Architecture: 8 services total
#   - 1 API Gateway (HTTP, port 3000)
#   - 7 Microservices (TCP): Search, Services, Routes, Booking, Reservation, Payment, Email
#
# Usage:
#   Development (native): npm run start:all
#   Development (docker): docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml --env-file .env.development up -d
#   Staging:     docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.staging.yml --env-file .env.staging up -d
#   Production:  docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================

services:
  # ─── API Gateway (HTTP) ────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-api-gateway
    image: wanderlust-air/api-gateway:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ${DB_HOST:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-flight_booking_db}
      DB_USER: ${DB_USER:-sa}
      DB_PASS: ${DB_PASS:-Passw0rd123!}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_CERT: ${DB_TRUST_CERT:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_secret_change_before_production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEARCH_MS_HOST: search-ms
      SEARCH_MS_PORT: ${SEARCH_MS_PORT:-4001}
      SERVICES_MS_HOST: services-ms
      SERVICES_MS_PORT: ${SERVICES_MS_PORT:-4002}
      ROUTES_MS_HOST: routes-ms
      ROUTES_MS_PORT: ${ROUTES_MS_PORT:-4003}
      BOOKING_MS_HOST: booking-ms
      BOOKING_MS_PORT: ${BOOKING_MS_PORT:-4004}
      RESERVATION_MS_HOST: reservation-ms
      RESERVATION_MS_PORT: ${RESERVATION_MS_PORT:-4005}
      PAYMENT_MS_HOST: payment-ms
      PAYMENT_MS_PORT: ${PAYMENT_MS_PORT:-4006}
      EMAIL_MS_HOST: email-ms
      EMAIL_MS_PORT: ${EMAIL_MS_PORT:-4007}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      APP_URL: ${APP_URL:-http://localhost:3001}
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./public:/app/public
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      search-ms:
        condition: service_started
      services-ms:
        condition: service_started
      routes-ms:
        condition: service_started
      booking-ms:
        condition: service_started
      reservation-ms:
        condition: service_started
      payment-ms:
        condition: service_started
      email-ms:
        condition: service_started

  # ─── Search Microservice (TCP:4001) ──────────────────────────────────────────
  search-ms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wat-search-ms
    image: wanderlust-air/api-gateway:${VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ${DB_HOST:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-flight_booking_db}
      DB_USER: ${DB_USER:-sa}
      DB_PASS: ${DB_PASS:-Passw0rd123!}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_CERT: ${DB_TRUST_CERT:-true}
      SEARCH_MS_HOST: "0.0.0.0"
      SEARCH_MS_PORT: 4001
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
    command: ["node", "dist/microservices/search/main.search.js"]
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      disable: true


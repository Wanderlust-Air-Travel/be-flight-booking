global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      - to: 'alerts@yourdomain.com'
        from: 'alerts@yourdomain.com'
        smarthost: 'smtp.yourdomain.com:587'
        auth_username: 'alerts@yourdomain.com'
        auth_password: 'YOUR_SMTP_PASSWORD'
        send_resolved: true

  - name: 'slack'
    slack_configs:
      - channel: '#alerts'
        api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        send_resolved: true
        title: |
          {{ if eq .Status "firing" }}:fire: Firing{{ else }}:white_check_mark: Resolved{{ end }}: {{ .GroupLabels.alertname }}
        text: |
          {{ range .Alerts }}
          **{{ .Labels.severity | upper }}**: {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

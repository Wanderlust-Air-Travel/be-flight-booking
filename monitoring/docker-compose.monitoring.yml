# =============================================================================
# Wanderlust Air Travel — Monitoring Stack Docker Compose
# Usage:
#   docker network create wanderlust-air-net 2>/dev/null || true
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Access:
#   Prometheus:    http://your-vps-ip:9090
#   Grafana:        http://your-vps-ip:3002 (admin / CHANGE_ME)
#   Alertmanager:   http://your-vps-ip:9093
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: wat-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - wanderlust-air-net
    labels:
      app: prometheus

  grafana:
    image: grafana/grafana:10.4.0
    container_name: wat-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: CHANGE_ME_IN_PRODUCTION
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://monitoring.yourdomain.com
      GF_SERVER_DOMAIN: monitoring.yourdomain.com
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"
    networks:
      - wanderlust-air-net
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: wat-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - wanderlust-air-net

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  wanderlust-air-net:
    external: true

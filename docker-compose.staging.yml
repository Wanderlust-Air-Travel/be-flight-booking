# =============================================================================
# Wanderlust Air Travel — Staging Docker Compose Overrides
# be-flight-booking/docker-compose.staging.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.staging.yml --env-file .env.staging up -d
# =============================================================================

services:
  api-gateway:
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  sqlserver:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  redis:
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 300 10 --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  rabbitmq:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  # ─── Microservices resources ────────────────────────────────────────────────
  search-ms:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  services-ms:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  routes-ms:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  booking-ms:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  reservation-ms:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  payment-ms:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  email-ms:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

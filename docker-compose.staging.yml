# =============================================================================
# Wanderlust Air Travel — Staging Docker Compose Overrides
# be-flight-booking/docker-compose.staging.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.infrastructure.yml -f docker-compose.staging.yml --env-file .env.staging up -d
# =============================================================================

services:
  api-gateway:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  sqlserver:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  redis:
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 300 10 --appendonly yes

  rabbitmq:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

  # ─── Microservices ───────────────────────────────────────────────────
  search-ms:

  services-ms:

  routes-ms:

  booking-ms:

  reservation-ms:

  payment-ms:

  email-ms:
